<!DOCTYPE html>
<html lang="en">
    <head>
        {% include "head.html" %}
        <title>TeleRin</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
        <style>
            * {
                box-sizing: border-box;
            }

            .hi {
                height: 100vh;
                width: 100%;
                padding: 0;
                margin: 0;
                /* overflow: hidden; */
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                font-family: "proxima-nova", sans-serif; 
                background: rgb(0, 0, 0);
            }

            #demo {
                max-height: 80%;
                max-width: 80%;
                font-weight: 700;
            }

    </style>
    </head>
    <body>
        <div class="contenido hi">
            <svg id="demo" xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 100 100">
                <defs>
                    <clipPath id="theClipPath">
                    <rect id="theSquare" x="0" y="50" width="100" height="0" fill="red" />
                    </clipPath>
                </defs>
                <line id="target1" x1="0" y1="50" x2="0" y2="50" stroke-width="1" stroke="#00f2ff" />
                <line id="target2" x1="0" y1="50" x2="0" y2="50" stroke-width="1" stroke="#00f2ff" />
                <g id="clipPathReveal" clip-path="url(#theClipPath)">
                    <text transform="translate(50 55)" text-anchor="middle" font-size="18" fill="#fff">TeleRin <img src="{{ url_for('static', filename='logo_temporal.jpg')}}" class="logo_header"></text>
                </g>
            </svg>
            <button class="boton"></button>
            <button class="boton"></button>
        </div>
        {% include "registrarse/footer_inicio.html" %}
    </body>
    <script>
        console.clear();
        const tl = gsap.timeline({
        repeat: -1,
        repeatDelay: 0.5,
        defaults: { duration: 0.6, ease: "power2.inOut" }
        });
        gsap.set("#target1", { rotation: 45, svgOrigin: "50 50" });
        gsap.set("#target2", { rotation: 135, svgOrigin: "50 50" });
        tl.to("line", { attr: { x2: 100 } });
        tl.to("#target1", { rotation: 0 }, "turn");
        tl.to("#target2", { rotation: 180 }, "turn");
        tl.to("#target1", { y: -10 }, "move");
        tl.to("#target2", { y: 10 }, "move");
        tl.to("#theSquare", { attr: { height: 22, y: 38 } }, "move");
        tl.to("line", { attr: { x1: 50, x2: 50 } });
        tl.to("text", { duration: 1, opacity: 0, ease: "none" });

    </script>
</html>
