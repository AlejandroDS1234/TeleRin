<!DOCTYPE html>
<html lang="en">
<head>
    {% include "head.html" %}
    <title>{{ usuario["nombre_usuario"] }}</title>
</head>
<body>
    <div class="contenido d-flex flex-column usuario_pagina">
        {% include "pagina/header.html" %}
        <div class="orden_info_usuario">
            <div class="info_usuarios_seccion">
                <div class="imagen_usuario_foto">
                    <img src="{{ url_for('perfil_img', filename=usuario['foto_perfil_usuario']) }}" class="foto_perfil_ampliada_usuario_seccion">
                </div>
                <div class="info_usuario_text">
                    <h2>{{ usuario["nombre_usuario"] }}</h2>
                    <p> {{ usuario["correo_usuario"] }}</p>
                    <div>
                        <p>Genero: {{ genero }}</p>
                        <p>Pais: {{ pais }} </p>
                    </div>
                </div>
            </div>
            <div class="carrucel"></div>
        </div>
    </div>
    {% include "registrarse/footer_inicio.html" %}
</body>
{% include 'scripts.html' %}
</html>
