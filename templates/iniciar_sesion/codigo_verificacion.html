<!DOCTYPE html> 
<html lang="en">
    <head>
        {% include "head.html" %}
        <title>Codigo de Verificacion</title>
    </head>
    <body>
        <div class="contenido">
        <div class="degradado degradado_izquierda" style="opacity: 1;"></div>
        <div class="muñeco_proximamente">
            <div class="titulo">
            <img src="{{ url_for('static', filename='logo_temporal.jpg')}}">
            <h1>TeleRin</h1>
        </div>
        </div>
        <div class="ingresar_datos">
            <h2>Entrar</h2>
            <form class="formulario" id="formularioCodigoVerifiacion">
                <div class="fila_ingresar">
                    <label for="codigo_usuario" >Ingrese el codigo de verificacion:</label>
                    <input class="input_ingresar" name="codigo_usuario" id="codigo_usuario" type="number" required placeholder="Codigo" maxlength="255" minlength="8">
                </div>
                <div class="fila_ingresar">
                    <p>Revisa tu correo para ver el codigo de verificacion.</p>
                </div>
                <button type="submit" class="boton" name="Verificar">Verificar</button>
                

                <div class="fila_ingresar">
                    <div id="json_mensaje"></div>
                </div>

            </form>
        </div>
        </div>

        {% include "registrarse/footer_inicio.html" %}
    </body>
    <script type="module" src="{{ url_for('static', filename='JS/function_codigo_verificacion.js') }}"></script>
</html>
