services:
  telerin:
    build: ./TeleRin_backend
    container_name: telerin
    ports:
      - "1240:1240"
    volumes:
      - ./TeleRin_backend:/TELERIN
    environment:
      PYTHONUNBUFFERED: 1
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      SECRET_KEY: ${SECRET_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    depends_on:
      - db
    restart: always
    stdin_open: true
    tty: true

  frontend:
    build: ./TeleRin_frontend/TeleRinEND
    container_name: telerin_frontend
    ports:
      - "4210:4210"
    volumes:
      - ./TeleRin_frontend/TeleRinEND:/TELERINFRONTEND
      - /TELERINFRONTEND/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL}
    depends_on:
      - telerin
    restart: always
    stdin_open: true
    tty: true

  db:
    image: postgres:18
    container_name: database
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./TeleRin_backend/db-init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
